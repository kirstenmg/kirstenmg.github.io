<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="gallery" id="gallery"></div>

    <script>
        // const images = [
        //     ["./scrolling_photos/devils_club_canopy.jpg", "a canopy of devil's club plants"],
        //     ["./scrolling_photos/devils_club.jpg", "devil's club plants"],
        //     ["./scrolling_photos/ferns.jpg", "ferns in a pacific northwest forest"],
        //     ["./scrolling_photos/fluffy_flowers_yellow.jpg", "a bunch of tiny fluffy cream-colored flowers"],
        //     ["./scrolling_photos/greenlake.jpg", "greenlake on a clear day. the lifeguard is off-duty."],
        //     ["./scrolling_photos/puffy_flowers.jpg", "a fluffy bunch of tiny flowers"],
        //     ["./scrolling_photos/ravenna_bridge.jpg", "overhead view of woods"]
        // ];

        const images = [
            ["./photos_new/bloedel.jpg", "bloedel hall"],
            ["./photos_new/denny.jpg", "denny hall"],
            ["./photos_new/cyclamen.jpg", "cyclamen"],
            ["./photos_new/flowers.jpg", "meadow of flowers"],
            ["./photos_new/locust_tree.jpg", "pink flowers of a locust tree"],
            ["./photos_new/spring_maple.jpg", "looking up at a bright green japanese maple"],
            ["./photos_new/train_window.jpg", "some trees out a train window"],
            ["./photos_new/station.jpg", "mysterious structure above the trees"],
            ["./photos_new/swamp.jpg", "lilypad in the swamp"],
            ["./photos_new/ubna_meadow.jpg", "grassy meadow"]
        ];


        function selectImageByDate() {
            let today = new Date();
            const day = (today.getFullYear() + today.getMonth() + today.getDate())
            return images[day % images.length];
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const selectedImage = selectImageByDate();
            const src = selectedImage[0];
            const alt = selectedImage[1];
            console.log(selectedImage);

            document.documentElement.style.backgroundImage = "url(" + src + ")";
            document.documentElement.alt = alt;
        }

        renderGallery();
    </script>

    <style>
        #gallery-image {
            object-fit: cover;
            width: 100vw;
            height: 100vh;
        }

        :root {
            --bug-size: 50px;
        }


        .bug {
            position: fixed;
            top: 0;
            left: 0%;
            width: var(--bug-size);
            height: var(--bug-size);
            background-image: url('../scrolling_photos/ferns.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            animation: wiggle 10s infinite;
        }

        @keyframes wiggle {

            0% {
                transform: translate(0, 0) rotate(90deg);
            }

            12.5% {
                transform: translate(0, 25vh) rotate(90deg);
            }

            20% {
                transform: translate(0, 30vh) rotate(90deg);
            }

            22% {
                transform: translate(0, 50vh) rotate(90deg);
            }

            28% {
                transform: translate(0, 70vh) rotate(90deg);
            }

            31% {
                transform: translate(0, calc(90vh - var(--bug-size))) rotate(90deg);
            }

            33% {
                transform: translate(0, calc(100vh - var(--bug-size))) rotate(45deg);
            }

            35% {
                transform: translate(calc(5vw - var(--bug-size)), calc(100vh - var(--bug-size))) rotate(0deg);
            }


            37.5% {
                transform: translate(calc(25vw - var(--bug-size)), calc(100vh - var(--bug-size))) rotate(0deg);
            }

            48% {
                transform: translate(calc(95vw - var(--bug-size)), calc(100vh - var(--bug-size))) rotate(0deg);
            }

            50% {
                transform: translate(calc(100vw - var(--bug-size)), calc(100vh - var(--bug-size))) rotate(-45deg);
            }

            52% {
                transform: translate(calc(100vw - var(--bug-size)), calc(90vh - var(--bug-size))) rotate(-90deg);
            }


            62.5% {
                transform: translate(calc(100vw - var(--bug-size)), 50vh) rotate(-90deg);
            }

            73% {
                transform: translate(calc(100vw - var(--bug-size)), 10vh) rotate(-90deg);
            }

            75% {
                transform: translate(calc(100vw - var(--bug-size)), 0) rotate(-135deg);
            }

            77% {
                transform: translate(calc(95vw - var(--bug-size)), 0) rotate(-180deg);
            }

            87.5% {
                transform: translate(calc(25vw - var(--bug-size)), 0) rotate(-180deg);
            }

            97% {
                transform: translate(calc(5vw - var(--bug-size)), 0) rotate(-180deg);
            }

            100% {
                transform: translate(0, 0) rotate(-270deg);
            }

        }


        html {
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
        }
    </style>

    <!-- <div class="bug"></div> -->
</body>

</html
